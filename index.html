<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>一閃 · The Last Flash</title>
  <style>
    :root {
      --ink: #0a0908;
      --ink2: #161310;
      --paper: #f3ece0;
      --dim: #b7ad9e;
      --flash: #f4e7c3;
      --blood: #8a2424;
      --steel: #3a3530;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--ink); color: var(--paper); font-family: "Songti SC", "Noto Serif TC", "PingFang HK", serif; overflow: hidden; touch-action: manipulation; }
    #app { position: relative; height: 100dvh; width: 100%; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .grain { pointer-events: none; position: absolute; inset: 0; opacity: .12; background-image: radial-gradient(#fff 0.4px, transparent 0.4px); background-size: 3px 3px; }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: max(1rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom)); }
    .kicker { letter-spacing: .32em; font-size: .7rem; color: var(--dim); text-transform: uppercase; }
    h1 { font-size: 3.2rem; letter-spacing: .28em; margin-top: .4rem; }
    h2 { font-size: 1.8rem; letter-spacing: .2em; }
    .muted { color: var(--dim); letter-spacing: .16em; line-height: 1.7; }
    .grow { flex: 1; }
    button.btn {
      height: 48px; border: 1px solid rgba(243,236,224,.25); background: transparent; color: var(--paper);
      letter-spacing: .32em; font: inherit; font-size: .9rem; border-radius: 10px; width: 100%;
    }
    button.btn.solid { background: var(--paper); color: var(--ink); border-color: var(--paper); }
    button.btn:disabled { opacity: .4; }
    .stack { display: grid; gap: .7rem; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .card { border: 1px solid rgba(243,236,224,.15); background: rgba(22,19,16,.72); border-radius: 12px; padding: .85rem 1rem; text-align: left; width: 100%; color: inherit; font: inherit; }
    .list { overflow: auto; display: grid; gap: .65rem; padding-bottom: .5rem; }
    .qte {
      position: absolute; border: 2px solid var(--paper); background: rgba(10,9,8,.55); color: var(--paper);
      border-radius: 999px; letter-spacing: .18em; transform: translate(-50%,-50%); font: inherit;
      display: grid; place-items: center; animation: pulse .9s ease-in-out infinite;
    }
    .qte.perfect { border-color: var(--flash); color: var(--flash); box-shadow: 0 0 24px rgba(244,231,195,.25); }
    .hud { position: absolute; inset: 0; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1.5rem; background: rgba(10,9,8,.45); }
    .timer { height: 3px; background: rgba(243,236,224,.15); border-radius: 99px; overflow: hidden; margin: 1rem auto 0; width: min(80%, 18rem); }
    .timer > i { display: block; height: 100%; background: var(--flash); width: 100%; transform-origin: left; }
    @keyframes pulse { 50% { transform: translate(-50%,-50%) scale(1.04); } }
    @keyframes slap { 0% { transform: translateX(0); } 20% { transform: translateX(-18px) rotate(-4deg); } 100% { transform: translateX(0); } }
    .slapped { animation: slap .35s ease-out; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .switch { width: 42px; height: 24px; border-radius: 99px; background: var(--steel); position: relative; border: 0; }
    .switch.on { background: var(--blood); }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); transition: left .15s; }
    .switch.on::after { left: 21px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="game.js"></script>
</body>
</html>
